services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      # Postgres 18 refuses a mount at /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: lynxprompt
      POSTGRES_USER: lynxprompt
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lynxprompt -d lynxprompt"]
      interval: 5s
      timeout: 5s
      retries: 5

  lynxprompt:
    image: drumsergio/lynxprompt:2.1.40
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # One database per Prisma schema; the app creates the other three on first start.
      DB_APP_HOST: postgres
      DB_APP_USER: lynxprompt
      DB_APP_PASSWORD: ${DB_PASSWORD}
      DB_APP_NAME: lynxprompt
      DB_USERS_HOST: postgres
      DB_USERS_USER: lynxprompt
      DB_USERS_PASSWORD: ${DB_PASSWORD}
      DB_USERS_NAME: lynxprompt_users
      DB_BLOG_HOST: postgres
      DB_BLOG_USER: lynxprompt
      DB_BLOG_PASSWORD: ${DB_PASSWORD}
      DB_BLOG_NAME: lynxprompt_blog
      DB_SUPPORT_HOST: postgres
      DB_SUPPORT_USER: lynxprompt
      DB_SUPPORT_PASSWORD: ${DB_PASSWORD}
      DB_SUPPORT_NAME: lynxprompt_support
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      NEXTAUTH_URL: ${APP_URL:?APP_URL must be set}
      APP_URL: ${APP_URL:?APP_URL must be set}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      # Sign-in is a link sent by mail, so SMTP is needed to log in.
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM must be set}

volumes:
  pgdata:
  uploads:
